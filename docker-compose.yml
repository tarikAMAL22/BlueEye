services:
  redis:
    image: redis:7-alpine
    container_name: blueeye-redis
    restart: unless-stopped
    networks:
      - blueeye-network

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw
      MYSQL_DATABASE: blueeye
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - blueeye-network

  app:
    image: node:22
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://root:my-secret-pw@db:3306/blueeye
      - NODE_ENV=development
      - MEDIAMTX_INTERNAL_URL=http://mediamtx:8888
      - STREAM_SERVER_URL=http://stream-server:33253
      - PUBLIC_URL=http://localhost:33253
    depends_on:
      - db
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - "C:/sources/Video Server Tests/videos:/videos:ro"
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - blueeye-network
    deploy:
      resources:
        reservations:
          cpus: '1'
          memory: 2048M
    # corepack enables pnpm. We wait for db to be up before pushing schema.
    command: >
      bash -c "
      corepack enable pnpm &&
      pnpm install &&
      echo 'Waiting for database...' &&
      npx -y wait-port db:3306 &&
      echo 'Database is ready. (Skipping automated schema push)...' &&
      echo 'Starting development server...' &&
      pnpm run dev
      "

  cv-worker:
    build:
      context: .
      dockerfile: Dockerfile.cv.gpu
    container_name: blueeye-cv-worker
    runtime: nvidia
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=my-secret-pw
      - DB_NAME=blueeye
      - REID_TIME_WINDOW_SECONDS=120
      - BLUR_THRESHOLD=80
      - FACE_MATCH_HIGH=0.35
      - FACE_MATCH_MED=0.45
      - USE_CNN_DETECTOR=true
      - USE_YOLO_DETECTOR=true
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
    depends_on:
      - db
      - redis
    restart: unless-stopped
    shm_size: '4gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - .:/app
    networks:
      - blueeye-network

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: blueeye-mediamtx
    ports:
      - "8554:8554"
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
    restart: unless-stopped
    networks:
      - blueeye-network

  streamer:
    build:
      context: ./streamer
    container_name: blueeye-streamer
    volumes:
      - "C:/sources/Video Server Tests/videos:/videos:ro"
      - ./streamer_config:/streamer_config
    networks:
      - blueeye-network
    depends_on:
      - mediamtx
    restart: unless-stopped

  stream-server:
    build:
      context: ./stream-server
    container_name: blueeye-stream-server
    ports:
      - "33253:33253"
    environment:
      - PORT=33253
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=my-secret-pw
      - DB_NAME=blueeye
      - HLS_DIR=/tmp/hls
      - IDLE_TIMEOUT_MS=60000
    volumes:
      - "C:/sources/Video Server Tests/videos:/videos:ro"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - blueeye-network

networks:
  blueeye-network:
    driver: bridge

volumes:
  db_data:
  node_modules:
