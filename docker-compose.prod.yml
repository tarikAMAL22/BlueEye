services:
  redis:
    image: redis:7-alpine
    container_name: blueeye-redis
    restart: unless-stopped
    networks:
      - blueeye-network

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: blueeye
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - blueeye-network

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        VITE_MEDIAMTX_URL: http://${PUBLIC_IP}:${MEDIAMTX_HLS_PORT}
        VITE_APP_ID: blueeye
    container_name: blueeye-app
    ports:
      - "8080:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://root:${DB_PASSWORD}@db:3306/blueeye
      - JWT_SECRET=${JWT_SECRET}
      - STREAM_SERVER_URL=http://stream-server:4253
      - PUBLIC_URL=http://${PUBLIC_IP}:${BLUEEYE_PORT}/stream-hls
      - MEDIAMTX_INTERNAL_URL=http://mediamtx:8888
    depends_on:
      - db
    restart: unless-stopped
    volumes:
      - ./client/public/uploads:/app/client/public/uploads
    networks:
      - blueeye-network

  cv-worker:
    build:
      context: .
      dockerfile: Dockerfile.cv.gpu
    container_name: blueeye-cv-worker
    runtime: nvidia
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=blueeye
      - REID_TIME_WINDOW_SECONDS=120
      - BLUR_THRESHOLD=80
      - FACE_MATCH_HIGH=0.35
      - FACE_MATCH_MED=0.45
      - USE_CNN_DETECTOR=true
      - USE_YOLO_DETECTOR=true
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
    depends_on:
      - db
      - redis
    restart: unless-stopped
    shm_size: '4gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./client/public/uploads:/app/client/public/uploads
    networks:
      - blueeye-network

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: blueeye-mediamtx
    ports:
      - "8554:8554"
      - "1935:1935"
      - "1111:8888"
      - "8889:8889"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
    restart: unless-stopped
    networks:
      - blueeye-network

  stream-server:
    build:
      context: ./stream-server
    container_name: blueeye-stream-server
    environment:
      - PORT=4253
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=blueeye
      - HLS_DIR=/tmp/hls
      - IDLE_TIMEOUT_MS=60000
    volumes:
      - /tmp/hls:/tmp/hls
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - blueeye-network

networks:
  blueeye-network:
    driver: bridge

volumes:
  db_data:
