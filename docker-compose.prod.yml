services:
  redis:
    image: redis:7-alpine
    container_name: blueeye-redis
    restart: unless-stopped
    networks:
      - blueeye-network

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: blueeye
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - blueeye-network

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        # Clients (browsers) need the public IP to reach HLS/WebRTC streams
        VITE_MEDIAMTX_URL: http://${PUBLIC_IP}:8888
        VITE_APP_ID: blueeye
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://root:${DB_PASSWORD}@db:3306/blueeye
      - JWT_SECRET=${JWT_SECRET}
      - CV_WORKER_URL=http://cv-worker:5000
      - MEDIAMTX_INTERNAL_URL=http://mediamtx:8888
      - OAUTH_SERVER_URL=http://${PUBLIC_IP}:3000
      - OWNER_OPEN_ID=${OWNER_OPEN_ID}
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - blueeye-network

  cv-worker:
    build:
      context: .
      dockerfile: Dockerfile.v2
    container_name: blueeye-cv-worker
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=blueeye
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - REID_TIME_WINDOW_SECONDS=120
      - BLUR_THRESHOLD=80
      - FACE_MATCH_HIGH=0.35
      - FACE_MATCH_MED=0.45
      - USE_CNN_DETECTOR=false
      - USE_YOLO_DETECTOR=true
      - CV_WORKER_IN_DOCKER=true
    depends_on:
      - db
      - redis
    restart: unless-stopped
    shm_size: '4gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./uploads:/app/uploads
      - ./yolov8n.pt:/app/yolov8n.pt
    networks:
      - blueeye-network

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: blueeye-mediamtx
    ports:
      - "8554:8554"
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
    restart: unless-stopped
    networks:
      - blueeye-network

  streamer:
    build:
      context: ./streamer
    container_name: blueeye-streamer
    volumes:
      - ${VIDEO_PATH:-/videos}:/videos:ro
      - ./streamer_config:/streamer_config
    networks:
      - blueeye-network
    depends_on:
      - mediamtx
    restart: unless-stopped

networks:
  blueeye-network:
    driver: bridge

volumes:
  db_data:
